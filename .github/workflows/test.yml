name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - run: bunx tsc -p tsconfig.json
      # Start the built server and talk to it over MCP. What breaks here is
      # the wiring rather than the dialect logic, which abap-sql tests itself.
      - run: node test/adt.test.mjs
      - run: node test/smoke.mjs
